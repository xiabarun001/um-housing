name: refresh prices

# 每 12 小时抓一次 iProperty 在租列表和 iBilik 单间，更新 data/condos.json 的价格快照。
# 马来西亚时间 10:00 和 22:00（UTC 02:00 / 14:00）。也可以在 Actions 页面手动运行。
on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # iProperty 按 TLS 指纹拦爬虫：GitHub 机器上的 curl（连模仿 Chrome 的都）会被 403，
      # 用 curl-impersonate 模仿 iOS Safari 才放行（见 probe.yml 的试验结果）
      - name: install curl-impersonate
        run: |
          set -e
          V=v2.2.2
          mkdir -p "$HOME/ci"
          curl -sSL -o /tmp/ci.tar.gz "https://github.com/lexiforest/curl-impersonate/releases/download/$V/curl-impersonate-$V.x86_64-linux-gnu.tar.gz"
          tar -xzf /tmp/ci.tar.gz -C "$HOME/ci"
          chmod +x "$HOME/ci"/curl_* "$HOME/ci/curl-impersonate"
          test -x "$HOME/ci/curl_safari184_ios"
          echo "CURL_BIN=$HOME/ci/curl_safari184_ios" >> "$GITHUB_ENV"
      - name: refresh snapshot
        run: node scripts/refresh.mjs
      - name: commit if changed
        run: |
          git config user.name "um-housing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json data/price-history.json data/refresh-log.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh price snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
