name: fetch probe

# 手动运行：从 GitHub 的机器上用 iOS Safari 指纹抓一组网址（本机被拦的网站），把 HTML 存成 artifact 供本地分析页面结构。
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "要抓的网址，用空格分开"
        default: "https://speedhome.com/rent/kuala-lumpur/bangsar-south https://speedhome.com/rent/kuala-lumpur?q=KL%20Gateway"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: install curl-impersonate
        run: |
          set -e
          V=v2.2.2
          mkdir -p "$HOME/ci"
          curl -sSL -o /tmp/ci.tar.gz "https://github.com/lexiforest/curl-impersonate/releases/download/$V/curl-impersonate-$V.x86_64-linux-gnu.tar.gz"
          tar -xzf /tmp/ci.tar.gz -C "$HOME/ci"
          chmod +x "$HOME/ci"/curl_* "$HOME/ci/curl-impersonate"
      - name: fetch
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          mkdir -p out
          C="$HOME/ci/curl_safari184_ios"
          i=0
          for u in $URLS; do
            i=$((i+1))
            code=$($C -sL --max-time 60 -o "out/$i.html" -w '%{http_code}' "$u")
            echo "$code $u -> out/$i.html ($(wc -c < out/$i.html) bytes)"
            echo "$u" > "out/$i.url"
            sleep 2
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: probe-html
          path: out
          retention-days: 3
