name: probe sources

# 手动运行：从 GitHub 的机器上试各个房源网站给不给抓（打印 HTTP 状态码），用来决定自动刷新能用哪些来源。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: install curl-impersonate
        run: |
          set -e
          V=v2.2.2
          mkdir -p "$HOME/ci"
          curl -sSL -o /tmp/ci.tar.gz "https://github.com/lexiforest/curl-impersonate/releases/download/$V/curl-impersonate-$V.x86_64-linux-gnu.tar.gz"
          tar -xzf /tmp/ci.tar.gz -C "$HOME/ci"
          chmod +x "$HOME/ci"/curl_* "$HOME/ci/curl-impersonate"
      - name: probe
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          MUA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36'
          probe () {
            label="$1"; shift
            code=$(timeout 45 "$@" -s -o /tmp/body -w '%{http_code}' 2>/dev/null || echo ERR)
            size=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            title=$(grep -o '<title>[^<]*' /tmp/body 2>/dev/null | head -1 | cut -c8-80)
            echo "$code  $size  $label  | $title"
          }
          for url in \
            "https://www.iproperty.com.my/property-for-rent/at-pj8-1310" \
            "https://www.iproperty.com.my/rent/petaling-jaya/" \
            "https://www.propertyguru.com.my/property-for-rent?listing_type=rent&property_type_code[]=CONDO&freetext=KL%20Gateway" \
            "https://www.speedhome.com/rent/kuala-lumpur/bangsar-south" \
            "https://www.mudah.my/kuala-lumpur/apartment-condominium-for-rent?q=kl%20gateway" \
            "https://www.edgeprop.my/rent/kuala-lumpur/bangsar-south/condominium" \
            "https://www.ibilik.com/locations/malaysia/kuala-lumpur/pantai/bangsar-south" \
            "https://www.propsocial.my/property/list/rent?q=kl+gateway" \
            "https://www.instahome.my/rent/kuala-lumpur/bangsar-south" \
            "https://www.durianproperty.com.my/rent" \
            ; do
            echo "== $url"
            probe "curl+UA"      curl -L --compressed -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' -H 'Accept: text/html' "$url"
            probe "curl+mobile"  curl -L --compressed -A "$MUA" -H 'Accept-Language: en-US,en;q=0.9' -H 'Accept: text/html' "$url"
            probe "chrome131"    "$HOME/ci/curl_chrome131" -L "$url"
            probe "chrome131_android" "$HOME/ci/curl_chrome131_android" -L "$url"
            probe "safari184_ios" "$HOME/ci/curl_safari184_ios" -L "$url"
            sleep 2
          done
          echo "== iProperty API guesses"
          probe "api-rblsapi"  "$HOME/ci/curl_chrome131" -L "https://www.iproperty.com.my/rest/v1/listing?propertyId=1310&listingType=rent"
          probe "iproperty-sitemap" "$HOME/ci/curl_chrome131" -L "https://www.iproperty.com.my/sitemap.xml"
          echo "== runner egress IP"
          curl -s https://api.ipify.org || true
          echo
