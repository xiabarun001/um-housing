<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>出图 · UM 租房指南</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202609081700">
<style>
  .cards-settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 18px; align-items: end; }
  .cards-settings label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--ink-2); }
  .cards-settings input[type="text"], .cards-settings input[type="date"] { border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 10px; background: var(--card); color: var(--ink); font-size: 15px; }
  .cards-settings .check { flex-direction: row; align-items: center; gap: 8px; padding-bottom: 8px; }
  .cards-acts { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .post { margin-top: 36px; }
  .post h3 { font-size: 20px; margin-bottom: 4px; }
  .post .muted { margin: 0 0 14px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .card-item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 8px; }
  .card-item canvas { width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--line); display: block; background: #fff; }
  .card-item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .card-item .row b { color: var(--ink); font-weight: 600; }
  #status { font-size: 13px; color: var(--ink-3); }
  .cap { margin-top: 16px; border: 1px dashed var(--line-2); border-radius: 10px; padding: 12px 16px 14px; background: var(--card); }
  .cap h4 { font-size: 12px; letter-spacing: .06em; color: var(--ink-3); margin: 10px 0 4px; font-family: var(--sans); font-weight: 600; }
  .cap h4:first-child { margin-top: 0; }
  .cap p { margin: 0; font-size: 14px; }
  .cap .cap-t { font-weight: 700; font-size: 16px; }
  .cap pre { white-space: pre-wrap; font: inherit; font-size: 14px; margin: 0; color: var(--ink-2); line-height: 1.6; }
  .cap .cap-g { color: var(--r2); }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./">UM 租房指南</a>
  <nav class="nav"><a href="./">回到指南</a></nav>
</header>
<main id="top">
  <section class="section">
    <p class="step-eyebrow">内部工具</p>
    <h2 class="section-title">小红书出图：固定信息从数据直接生成</h2>
    <p class="section-lede">下面的图都是从 condos.json 和指南页面现场画出来的，改了数据或文字回来重新下载就行，不用手工排版。每张图 1080 × 1440（小红书 3:4），角落自动带账号、网址、版本日期和授权标记。每篇帖子下面还有现成的标题、正文和标签，点一下复制。</p>
    <div class="needs-block">
      <div class="cards-settings">
        <label>小红书账号名 <input type="text" id="cfg-name" placeholder="比如：UM 租房指南"></label>
        <label>小红书号 <input type="text" id="cfg-id" placeholder="比如：123456789"></label>
        <label>版本日期（固定信息核实日期） <input type="date" id="cfg-date"></label>
        <label class="check"><input type="checkbox" id="cfg-price"> 小区卡片带一行“行情（到月份）”</label>
      </div>
      <div class="cards-acts">
        <button type="button" class="btn primary" id="dl-all">全部下载（29 张）</button>
        <button type="button" class="btn" id="redraw">重新生成</button>
        <span id="status"></span>
      </div>
    </div>
    <div id="posts"></div>
  </section>
</main>
<footer class="foot">
  <p>这页不对外链接，只给自己出图用。图片内容以 CC BY-NC-SA 4.0 授权，发布时保留角落的来源标记。</p>
</footer>
<script type="module" src="js/cards.js?v=202609081700"></script>
</body>
</html>
